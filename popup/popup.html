<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="nav">
      <button id="prev" title="Previous day">&#8249;</button>
      <div id="label">Today</div>
      <button id="next" title="Next day">&#8250;</button>
    </div>
    <div id="total">0 min</div>
    <div class="sub">active browsing time</div>
    <div class="chips">
      <div class="chip"><b id="sites">0</b><span>sites</span></div>
      <div class="chip"><b id="visits">0</b><span>visits</span></div>
      <div class="chip"><b id="clicks">0</b><span>clicks</span></div>
    </div>
  </header>

  <section>
    <div class="cols"><span>Website</span><span>Time</span><span>Visits</span><span>Clicks</span></div>
    <div id="rows"></div>
    <p id="empty" hidden>No activity recorded.</p>
  </section>

  <section>
    <h2>Previous days</h2>
    <div id="history"></div>
  </section>

  <script src="../src/util.js"></script>
  <script src="popup.js"></script>
</body>
</html>
